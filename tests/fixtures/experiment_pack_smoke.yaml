critical_buses_config: configs/critical_buses_paper_fig2.yaml
output_root: results
report_path: reports/experiment_interpretation_pack.md
runs:
  - run_id: integrated_mainline_certified_small_smoke
    family_name: smoke_family
    case_name: integrated_mainline_certified_small_smoke
    runtime_source: data/runtime_12
    selection:
      scenarios_a: [1]
      scenarios_b: [1]
    mode: integrated_mainline
    solver: benders
    parameter_regime: base
    expected_validation_level: epsilon_certified
    benders:
      epsilon_cert: 20000.0
      max_iterations: 2

  - run_id: normal_only_certified_small_smoke
    family_name: smoke_family
    case_name: normal_only_certified_small_smoke
    runtime_source: data/runtime_12
    selection:
      scenarios_a: [1]
      scenarios_b: [1]
    mode: normal_only
    solver: direct_master
    parameter_regime: normal_only
    expected_validation_level: exact
