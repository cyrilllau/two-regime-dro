critical_buses_config: configs/critical_buses_paper_fig2.yaml
baseline_dir: artifacts/baselines/round_12
output_root: results/convergence_diagnostics
report_path: docs/analysis_packs/convergence_diagnostic_pack.md
runs:
  - run_id: smoke_normal_only_exact_zero
    family_name: convergence_diagnostics_smoke
    case_name: normal_only
    runtime_source: data/runtime_12
    selection:
      scenarios_a: [1]
      scenarios_b: [1]
    mode: normal_only
    solver: direct_master
    parameter_regime: paper_like_tableII
    parameter_overrides:
      economics:
        cfix: 153600.0
        ccons_sl: 540.07
        ccons_fa: 25000.0
        ctrans_scalar: 0.0435
        gamma: 0.01
        theta: 20
        pi_f: 0.3
      ev:
        p_ev_rated_sl: 7.0
        p_ev_rated_fa: 50.0
        nbar_sl: 25
        nbar_fa: 10

  - run_id: smoke_integrated_epsilon_stop
    family_name: convergence_diagnostics_smoke
    case_name: integrated_mainline
    runtime_source: data/runtime_12
    selection:
      scenarios_a: [1]
      scenarios_b: [1]
    mode: integrated_mainline
    solver: benders
    parameter_regime: paper_like_tableII
    parameter_overrides:
      economics:
        cfix: 153600.0
        ccons_sl: 540.07
        ccons_fa: 25000.0
        ctrans_scalar: 0.0435
        gamma: 0.01
        theta: 20
        pi_f: 0.3
      ev:
        p_ev_rated_sl: 7.0
        p_ev_rated_fa: 50.0
        nbar_sl: 25
        nbar_fa: 10
      ambiguity:
        k_max_outages: 2
    benders:
      epsilon_cert: 20000.0
      max_iterations: 2

  - run_id: smoke_integrated_max_iter
    family_name: convergence_diagnostics_smoke
    case_name: integrated_mainline
    runtime_source: data/runtime_12
    selection:
      scenarios_a: [1]
      scenarios_b: [1]
    mode: integrated_mainline
    solver: benders
    parameter_regime: paper_like_tableII
    parameter_overrides:
      economics:
        cfix: 153600.0
        ccons_sl: 540.07
        ccons_fa: 25000.0
        ctrans_scalar: 0.0435
        gamma: 0.01
        theta: 20
        pi_f: 0.3
      ev:
        p_ev_rated_sl: 7.0
        p_ev_rated_fa: 50.0
        nbar_sl: 25
        nbar_fa: 10
      ambiguity:
        k_max_outages: 2
    benders:
      epsilon_cert: 0.0
      max_iterations: 2
