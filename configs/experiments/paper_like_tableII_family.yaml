    case_name: integrated_mainline_paper_like
    runtime_source: data/runtime_12
    selection:
      scenarios_a: [1]
      scenarios_b: [1]
    mode: integrated_mainline
    solver: benders
    parameter_regime: paper_like_tableII
    parameter_overrides:
      economics:
        cfix: 153600.0
        ccons_sl: 540.07
        ccons_fa: 25000.0
        ctrans_scalar: 0.0435
        gamma: 0.01
        theta: 20
        pi_f: 0.3
      ev:
        p_ev_rated_sl: 7.0
        p_ev_rated_fa: 50.0
        nbar_sl: 25
        nbar_fa: 10
    benders:
      epsilon_cert: 20000.0
