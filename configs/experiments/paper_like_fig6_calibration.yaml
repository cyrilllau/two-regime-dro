critical_buses_config: configs/critical_buses_paper_fig2.yaml
output_root: results/paper_like_calibration
report_path: docs/analysis_packs/paper_like_fig6_calibration_pack.md
family_name: paper_like_fig6_calibration

base_run:
  runtime_source: data/runtime_12
  selection:
    scenarios_a: [1]
    scenarios_b: [1]
  parameter_regime: paper_like_fig6_calibration
  parameter_overrides:
    economics:
      cfix: 153600.0
      ccons_sl: 540.07
      ccons_fa: 25000.0
      ctrans_scalar: 0.0435
      gamma: 0.01
      theta: 20
      pi_f: 0.3
    ev:
      p_ev_rated_sl: 7.0
      p_ev_rated_fa: 50.0
      nbar_sl: 25
      nbar_fa: 10
  benders:
    epsilon_cert: 20000.0
    max_iterations: 5

stage1_candidates:
  - candidate_id: S0_baseline
    description: Current paper-like baseline.
    mode: normal_only
    solver: direct_master
    parameter_overrides: {}

  - candidate_id: S1_site_cost_up
    description: Raise site fixed cost by 4x.
    mode: normal_only
    solver: direct_master
    parameter_overrides:
      economics:
        cfix: 614400.0

  - candidate_id: S2_site_cost_up_transport_down
    description: S1 plus 0.75x transport scalar.
    mode: normal_only
    solver: direct_master
    parameter_overrides:
      economics:
        cfix: 614400.0
        ctrans_scalar: 0.032625

  - candidate_id: S3_site_cost_up_transport_half
    description: S1 plus 0.5x transport scalar.
    mode: normal_only
    solver: direct_master
    parameter_overrides:
      economics:
        cfix: 614400.0
        ctrans_scalar: 0.02175

  - candidate_id: S4_sparse_slow_cost_up
    description: S2 plus 5x slow-charger construction cost.
    mode: normal_only
    solver: direct_master
    parameter_overrides:
      economics:
        cfix: 614400.0
        ctrans_scalar: 0.032625
        ccons_sl: 2700.35

  - candidate_id: S5_sparse_slow_cost_up_more
    description: S2 plus 10x slow-charger construction cost.
    mode: normal_only
    solver: direct_master
    parameter_overrides:
      economics:
        cfix: 614400.0
        ctrans_scalar: 0.032625
        ccons_sl: 5400.7

  - candidate_id: S6_mixed_station_bias
    description: S4 plus lower fast-charger construction cost to encourage mixed stations.
    mode: normal_only
    solver: direct_master
    parameter_overrides:
      economics:
        cfix: 614400.0
        ctrans_scalar: 0.032625
        ccons_sl: 2700.35
        ccons_fa: 12000.0

stage2_modes:
  - mode: integrated_mainline
    solver: benders
    run_id: integrated_mainline_paper_like_tuned
    case_name: integrated_mainline_paper_like_tuned

  - mode: normal_only
    solver: direct_master
    run_id: normal_only_paper_like_tuned
    case_name: normal_only_paper_like_tuned

  - mode: disaster_only
    solver: benders
    run_id: disaster_only_paper_like_tuned
    case_name: disaster_only_paper_like_tuned

  - mode: deterministic_mean_value
    solver: benders
    run_id: deterministic_mean_value_paper_like_tuned
    case_name: deterministic_mean_value_paper_like_tuned

demand_normalization:
  - candidate_id: D1_scale_0_85
    ev_penetration_scale: 0.85
  - candidate_id: D2_scale_0_70
    ev_penetration_scale: 0.70

stage1_rules:
  opened_bus_min: 6
  opened_bus_max: 8
  total_slow_max: 220
  min_fast_station_count: 2
  max_capped_slow_station_count: 2
  min_cluster_count: 3
  max_cluster_count: 4
  max_out_of_cluster_open_count: 1

target_clusters:
  left_branch:
    buses: [3, 4, 5, 19, 20, 21, 22]
  middle:
    buses: [9, 10]
  upper_branch:
    buses: [26, 27, 28, 29]
  right_upper_branch:
    buses: [32, 33]

target_semantics:
  run_id: paper_case1_target_semantics
  sites:
    - bus: 3
      n_sl: 22
      n_fa: 1
    - bus: 5
      n_sl: 3
      n_fa: 0
    - bus: 22
      n_sl: 1
      n_fa: 2
    - bus: 10
      n_sl: 0
      n_fa: 3
    - bus: 28
      n_sl: 21
      n_fa: 4
    - bus: 32
      n_sl: 24
      n_fa: 3
    - bus: 33
      n_sl: 3
      n_fa: 0
